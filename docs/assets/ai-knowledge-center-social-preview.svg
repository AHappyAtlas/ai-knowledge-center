<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Knowledge Center</title>
  <desc id="desc">Local-first project context, verification gates, and repository-scoped MCP for coding agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#09111f"/><stop offset="1" stop-color="#121f3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1070" cy="88" r="180" fill="#4f46e5" opacity=".22" filter="url(#glow)"/>
  <circle cx="220" cy="600" r="220" fill="#0ea5e9" opacity=".13" filter="url(#glow)"/>
  <rect x="76" y="76" width="1128" height="488" rx="28" fill="#0c172c" stroke="#273656"/>
  <rect x="112" y="120" width="336" height="50" rx="12" fill="#15243e"/>
  <circle cx="140" cy="145" r="8" fill="#7dd3fc"/><text x="160" y="152" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI KNOWLEDGE CENTER</text>
  <text x="112" y="250" fill="#f8fafc" font-family="Arial, sans-serif" font-size="60" font-weight="700">Your agent read the docs.</text>
  <text x="112" y="318" fill="#f8fafc" font-family="Arial, sans-serif" font-size="60" font-weight="700">Did it run the right checks?</text>
  <text x="112" y="376" fill="#b7c7e6" font-family="Arial, sans-serif" font-size="25">Local-first project context · verification gates · repo-scoped MCP</text>
  <rect x="112" y="436" width="356" height="62" rx="14" fill="url(#accent)"/>
  <text x="142" y="476" fill="#07111f" font-family="Arial, sans-serif" font-size="23" font-weight="700">npx aikc upgrade --write</text>
  <g transform="translate(825 173)">
    <rect width="290" height="250" rx="18" fill="#111f37" stroke="#3a4d74"/>
    <text x="28" y="46" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" font-weight="700">PROJECT EVIDENCE</text>
    <rect x="26" y="72" width="238" height="42" rx="9" fill="#162945"/>
    <circle cx="48" cy="93" r="8" fill="#34d399"/><text x="68" y="99" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16">typecheck · passed</text>
    <rect x="26" y="126" width="238" height="42" rx="9" fill="#162945"/>
    <circle cx="48" cy="147" r="8" fill="#34d399"/><text x="68" y="153" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16">lint · passed</text>
    <rect x="26" y="180" width="238" height="42" rx="9" fill="#162945"/>
    <circle cx="48" cy="201" r="8" fill="#34d399"/><text x="68" y="207" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16">build · passed</text>
  </g>
</svg>
